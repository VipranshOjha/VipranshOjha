name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: VipranshOjha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#007FFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#007FFF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
