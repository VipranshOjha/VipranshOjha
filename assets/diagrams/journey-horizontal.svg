<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!--
      Horizontal line gradient:
      dim at left (distant past) → bright at right (still building / present)
    -->
    <linearGradient id="hline" x1="100" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="25%"  stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#A855F7" stop-opacity="0.34"/>
      <stop offset="75%"  stop-color="#A855F7" stop-opacity="0.47"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Glow for regular nodes -->
    <filter id="gn" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for present node (Still Building) -->
    <filter id="gp" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient radial glow at present node -->
    <radialGradient id="presentbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5B21B6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow for the horizontal line -->
    <filter id="gline" x="-2%" y="-1000%" width="104%" height="2100%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow for milestone symbol icons -->
    <filter id="gicon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for Still Building icon -->
    <filter id="gicon-p" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Ambient ellipse behind present node (drawn beneath everything) -->
  <ellipse cx="800" cy="168" rx="95" ry="78" fill="url(#presentbg)"/>

  <!-- Horizontal timeline line — glow pass -->
  <line x1="100" y1="168" x2="800" y2="168"
    stroke="#A855F7" stroke-opacity="0.07" stroke-width="8"
    filter="url(#gline)"/>

  <!-- Horizontal timeline line — crisp pass -->
  <line x1="100" y1="168" x2="800" y2="168"
    stroke="url(#hline)" stroke-width="1.2"/>

  <!-- Origin tick at left edge of line -->
  <line x1="100" y1="159" x2="100" y2="177"
    stroke="#A855F7" stroke-opacity="0.20" stroke-width="0.8"/>

  <!-- Continuation dots to the right of Still Building -->
  <circle cx="828" cy="168" r="2.2" fill="#A855F7" fill-opacity="0.26"/>
  <circle cx="842" cy="168" r="1.7" fill="#A855F7" fill-opacity="0.16"/>
  <circle cx="854" cy="168" r="1.2" fill="#A855F7" fill-opacity="0.09"/>

  <!-- Subtle watermark — top left -->
  <text x="14" y="18"
    fill="#A855F7" fill-opacity="0.22"
    font-size="7.5" font-weight="600"
    letter-spacing="3.5"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">THE JOURNEY</text>

  <!--
    ══════════════════════════════════════════════════════
    NODE LAYOUT:
      x positions: 100, 275, 450, 625, 800  (gap = 175px)
      Timeline line: y = 168

      ABOVE (odd: 1, 3, 5):  Title y=86, Icon y=103, Q y=121, Lesson y=139
      BELOW (even: 2, 4):    Icon y=196, Title y=212, Q y=230, Lesson y=248

    Each milestone has a unique small geometric marker (icon)
    instead of emoji, for reliable cross-platform SVG rendering:
      1. Curious Explorer    — ◈  (diamond with center dot)
      2. Problem Solver      — ○  (open circle, puzzle idea)
      3. Systems Builder     — ▪  (solid square, structure)
      4. Collaborative Eng.  — △  (triangle, teamwork peak)
      5. Still Building      — ✦  (4-point star, active energy)
    ══════════════════════════════════════════════════════
  -->

  <!-- ══════════════════════════════════════════════ -->
  <!--  NODE 1 — Curious Explorer  (x=100)           -->
  <!--  Content: ABOVE the line                       -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Halo -->
  <circle cx="100" cy="168" r="18"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <!-- Main ring -->
  <circle cx="100" cy="168" r="10"
    fill="#0D1117" stroke="#8B5CF6" stroke-width="1.0"
    filter="url(#gn)"/>
  <!-- Inner dot -->
  <circle cx="100" cy="168" r="3" fill="#D8B4FE" fill-opacity="0.85"/>

  <!-- Title -->
  <text x="100" y="86"
    text-anchor="middle"
    fill="#E9D5FF" fill-opacity="0.90"
    font-size="12.5" font-weight="600"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Curious Explorer</text>
  <!-- Milestone icon: small diamond shape (◈) -->
  <text x="100" y="103"
    text-anchor="middle"
    fill="#A855F7" fill-opacity="0.72"
    font-size="11"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    filter="url(#gicon)">◈</text>
  <!-- Question -->
  <text x="100" y="121"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.56"
    font-size="10" font-style="italic"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Can I build this myself?</text>
  <!-- Lesson -->
  <text x="100" y="139"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.74"
    font-size="10"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">Curiosity became my greatest teacher.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  NODE 2 — Problem Solver  (x=275)             -->
  <!--  Content: BELOW the line                       -->
  <!-- ══════════════════════════════════════════════ -->

  <circle cx="275" cy="168" r="18"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <circle cx="275" cy="168" r="10"
    fill="#0D1117" stroke="#8B5CF6" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="275" cy="168" r="3" fill="#D8B4FE" fill-opacity="0.85"/>

  <!-- Milestone icon: open circle (○) -->
  <text x="275" y="196"
    text-anchor="middle"
    fill="#A855F7" fill-opacity="0.72"
    font-size="11"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    filter="url(#gicon)">○</text>
  <!-- Title -->
  <text x="275" y="212"
    text-anchor="middle"
    fill="#E9D5FF" fill-opacity="0.90"
    font-size="12.5" font-weight="600"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Problem Solver</text>
  <!-- Question -->
  <text x="275" y="230"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.56"
    font-size="10" font-style="italic"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Can this solve a real problem?</text>
  <!-- Lesson -->
  <text x="275" y="248"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.74"
    font-size="10"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">Software becomes meaningful when it helps people.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  NODE 3 — Systems Builder  (x=450)            -->
  <!--  Content: ABOVE the line                       -->
  <!-- ══════════════════════════════════════════════ -->

  <circle cx="450" cy="168" r="18"
    fill="#A855F7" fill-opacity="0.05"
    stroke="#A855F7" stroke-opacity="0.07" stroke-width="0.5"/>
  <circle cx="450" cy="168" r="10"
    fill="#0D1117" stroke="#8B5CF6" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="450" cy="168" r="3" fill="#D8B4FE" fill-opacity="0.88"/>

  <!-- Title -->
  <text x="450" y="86"
    text-anchor="middle"
    fill="#E9D5FF" fill-opacity="0.90"
    font-size="12.5" font-weight="600"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Systems Builder</text>
  <!-- Milestone icon: solid square (▪) -->
  <text x="450" y="103"
    text-anchor="middle"
    fill="#A855F7" fill-opacity="0.72"
    font-size="11"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    filter="url(#gicon)">▪</text>
  <!-- Question -->
  <text x="450" y="121"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.56"
    font-size="10" font-style="italic"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">What does the complete solution look like?</text>
  <!-- Lesson -->
  <text x="450" y="139"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.74"
    font-size="10"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">Systems matter more than features.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  NODE 4 — Collaborative Engineer  (x=625)     -->
  <!--  Content: BELOW the line                       -->
  <!-- ══════════════════════════════════════════════ -->

  <circle cx="625" cy="168" r="18"
    fill="#A855F7" fill-opacity="0.05"
    stroke="#A855F7" stroke-opacity="0.07" stroke-width="0.5"/>
  <circle cx="625" cy="168" r="10"
    fill="#0D1117" stroke="#8B5CF6" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="625" cy="168" r="3" fill="#D8B4FE" fill-opacity="0.88"/>

  <!-- Milestone icon: triangle (△) -->
  <text x="625" y="196"
    text-anchor="middle"
    fill="#A855F7" fill-opacity="0.72"
    font-size="11"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    filter="url(#gicon)">△</text>
  <!-- Title -->
  <text x="625" y="212"
    text-anchor="middle"
    fill="#E9D5FF" fill-opacity="0.90"
    font-size="12.5" font-weight="600"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Collaborative Engineer</text>
  <!-- Question -->
  <text x="625" y="230"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.56"
    font-size="10" font-style="italic"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">How do we build something bigger than ourselves?</text>
  <!-- Lesson -->
  <text x="625" y="248"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.74"
    font-size="10"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">Great engineering is collaborative.</text>

  <!-- ══════════════════════════════════════════════ -->
  <!--  NODE 5 — Still Building  (x=800)             -->
  <!--  Content: ABOVE the line (special treatment)  -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Extended ambient halo -->
  <circle cx="800" cy="168" r="55" fill="#5B21B6" fill-opacity="0.07"/>
  <!-- Outer halo (larger than others) -->
  <circle cx="800" cy="168" r="24"
    fill="#A855F7" fill-opacity="0.06"
    stroke="#A855F7" stroke-opacity="0.10" stroke-width="0.5"/>
  <!-- Main ring (larger) -->
  <circle cx="800" cy="168" r="14"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.4"
    filter="url(#gp)"/>
  <!-- Inner decorative ring -->
  <circle cx="800" cy="168" r="8"
    fill="none" stroke="#A855F7" stroke-opacity="0.18" stroke-width="0.5"/>
  <!-- Center dot (larger, fully bright) -->
  <circle cx="800" cy="168" r="4" fill="#E9D5FF"/>

  <!-- Title — slightly larger, full brightness -->
  <text x="800" y="86"
    text-anchor="middle"
    fill="#E9D5FF"
    font-size="13.5" font-weight="700"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.5">Still Building</text>
  <!-- Milestone icon: 4-point star (✦) -->
  <text x="800" y="103"
    text-anchor="middle"
    fill="#A855F7"
    font-size="12"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    filter="url(#gicon-p)">✦</text>
  <!-- Question -->
  <text x="800" y="121"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.62"
    font-size="10" font-style="italic"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">What's the next interesting problem?</text>
  <!-- Lesson — brighter than all others -->
  <text x="800" y="139"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.86"
    font-size="10"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif">Still learning. Still building.</text>

</svg>
