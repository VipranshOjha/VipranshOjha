<svg
  width="900"
  height="320"
  viewBox="0 0 900 320"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!--
      ══════════════════════════════════════════════════════
      DESIGN TOKENS — matched to principles.svg
      ──────────────────────────────────────────────────────
      Node structure:
        Halo:      r=24  fill-op=0.04  stroke-op=0.06  sw=0.5
        Ring:      r=13.5  fill=#0D1117  stroke=#A855F7  sw=1.0
        Inner dot: r=3.2  fill=#D8B4FE

      Present node (Still Building — rightmost, largest):
        Ring:      r=18  stroke=#A855F7  sw=1.4
        Inner dot: r=4.5  fill=#E9D5FF
        (matches principles center node proportionally)

      Line technique (same as principles radial spokes):
        Glow pass:  stroke-opacity=0.09  stroke-width=8
        Crisp pass: stroke-opacity=0.45  stroke-width=0.7

      Typography:
        Stage name: font-size=12.5  fill=#D8B4FE  fill-op=0.80  ls=0.5
        Question:   font-size=10    fill=#C4B5FD  fill-op=0.45  italic  fw=300
        Lesson:     font-size=10    fill=#C4B5FD  fill-op=0.30  fw=300

      Glow filters:
        gn  stdDeviation=5   (outer nodes — same as principles)
        gc  stdDeviation=8   (present node — same as principles center)
        gt  stdDeviation=3   (title — same as principles title)
      ══════════════════════════════════════════════════════
    -->

    <!-- Glow for outer nodes (matches principles outer nodes exactly) -->
    <filter id="gn" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow for present node (matches principles center node exactly) -->
    <filter id="gc" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient radial glow (matches principles #bgr, same color) -->
    <radialGradient id="bgr" cx="85%" cy="50%" r="38%">
      <stop offset="0%"   stop-color="#4C1D95" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>

    <!--
      Horizontal line gradient:
      dim at left (origin) → bright near present → fades beyond present
      Using same opacity values as principles spoke crisp lines (0.45)
    -->
    <linearGradient id="hline" x1="90" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.10"/>
      <stop offset="20%"  stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="42%"  stop-color="#A855F7" stop-opacity="0.32"/>
      <stop offset="64%"  stop-color="#A855F7" stop-opacity="0.42"/>
      <stop offset="82%"  stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="92%"  stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Same gradient for the glow pass of the line -->
    <linearGradient id="hglow" x1="90" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.03"/>
      <stop offset="82%"  stop-color="#A855F7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0"/>
    </linearGradient>

  </defs>

  <!-- Ambient background gradient concentrated at present node (right side) -->
  <rect width="900" height="320" fill="url(#bgr)"/>

  <!--
    ══════════════════════════════════════════════════════
    LAYOUT
    ──────────────────────────────────────────────────────
    Node x positions:  90, 265, 440, 615, 790  (gap=175px)
    Timeline line y:   160

    Alternating layout (same as v1 prototype):
      ABOVE (1, 3, 5): Stage y=76  Q y=100  Lesson y=116  Node cy=160
      BELOW (2, 4):    Node cy=160  Stage y=204  Q y=222  Lesson y=238

    Node visual weight increases left → right:
      N1–4: halo r=24, ring r=13.5, dot r=3.2
      N5 (present): halo r=30, ring r=18, dot r=4.5  (matches principles center)

    Glow increases left → right via graduated line gradient
    + stronger filter on N5 (gc vs gn)

    Progression at a glance:
      Explorer → Solver → Builder → Collaborator → Still Building
    ══════════════════════════════════════════════════════
  -->

  <!-- ── Timeline line: glow pass (same technique as principles spokes) ── -->
  <line x1="90" y1="160" x2="860" y2="160"
    stroke="url(#hglow)" stroke-width="8"/>

  <!-- ── Timeline line: crisp pass ── -->
  <line x1="90" y1="160" x2="860" y2="160"
    stroke="url(#hline)" stroke-width="0.7"/>

  <!-- Origin tick (same visual language as principles) -->
  <line x1="90" y1="152" x2="90" y2="168"
    stroke="#A855F7" stroke-opacity="0.18" stroke-width="0.7"/>


  <!-- ══════════════════════════════════════════════════════ -->
  <!--  NODE 1 — Explorer  (x=90)                            -->
  <!--  Content: ABOVE the line                              -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Halo -->
  <circle cx="90" cy="160" r="24"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <!-- Ring (principles outer node: r=13.5, stroke=#A855F7, sw=1.0) -->
  <circle cx="90" cy="160" r="13.5"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.0"
    filter="url(#gn)"/>
  <!-- Inner dot (principles: r=3.2, fill=#D8B4FE) -->
  <circle cx="90" cy="160" r="3.2" fill="#D8B4FE"/>

  <!-- Stage name (principles node label: 12.5px, #D8B4FE, op=0.80, ls=0.5) -->
  <text x="90" y="76"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.80"
    font-size="12.5"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.5">Explorer</text>
  <!-- Question (principles subtitle: 10.5px italic #C4B5FD op=0.45 fw=300) -->
  <text x="90" y="100"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.45"
    font-size="10" font-style="italic" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Can I build it?</text>
  <!-- Lesson (further de-emphasized: op=0.30) -->
  <text x="90" y="116"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.30"
    font-size="10" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Curiosity became my teacher.</text>


  <!-- ══════════════════════════════════════════════════════ -->
  <!--  NODE 2 — Solver  (x=265)                             -->
  <!--  Content: BELOW the line                              -->
  <!-- ══════════════════════════════════════════════════════ -->

  <circle cx="265" cy="160" r="24"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <circle cx="265" cy="160" r="13.5"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="265" cy="160" r="3.2" fill="#D8B4FE"/>

  <text x="265" y="204"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.80"
    font-size="12.5"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.5">Solver</text>
  <text x="265" y="222"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.45"
    font-size="10" font-style="italic" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Can this help?</text>
  <text x="265" y="238"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.30"
    font-size="10" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Software should help people.</text>


  <!-- ══════════════════════════════════════════════════════ -->
  <!--  NODE 3 — Builder  (x=440)                            -->
  <!--  Content: ABOVE the line                              -->
  <!-- ══════════════════════════════════════════════════════ -->

  <circle cx="440" cy="160" r="24"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <circle cx="440" cy="160" r="13.5"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="440" cy="160" r="3.2" fill="#D8B4FE"/>

  <text x="440" y="76"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.80"
    font-size="12.5"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.5">Builder</text>
  <text x="440" y="100"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.45"
    font-size="10" font-style="italic" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Complete systems?</text>
  <text x="440" y="116"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.30"
    font-size="10" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Systems matter more than features.</text>


  <!-- ══════════════════════════════════════════════════════ -->
  <!--  NODE 4 — Collaborator  (x=615)                       -->
  <!--  Content: BELOW the line                              -->
  <!-- ══════════════════════════════════════════════════════ -->

  <circle cx="615" cy="160" r="24"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <circle cx="615" cy="160" r="13.5"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.0"
    filter="url(#gn)"/>
  <circle cx="615" cy="160" r="3.2" fill="#D8B4FE"/>

  <text x="615" y="204"
    text-anchor="middle"
    fill="#D8B4FE" fill-opacity="0.80"
    font-size="12.5"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.5">Collaborator</text>
  <text x="615" y="222"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.45"
    font-size="10" font-style="italic" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">Better together?</text>
  <text x="615" y="238"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.30"
    font-size="10" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Great engineering is collaborative.</text>


  <!-- ══════════════════════════════════════════════════════ -->
  <!--  NODE 5 — Still Building  (x=790)                     -->
  <!--  Content: ABOVE the line                              -->
  <!--  Visual weight: matches principles CENTER node         -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Outer ambient (larger than standard halo) -->
  <circle cx="790" cy="160" r="50" fill="#7C3AED" fill-opacity="0.05"/>
  <!-- Halo (larger) -->
  <circle cx="790" cy="160" r="30"
    fill="#A855F7" fill-opacity="0.04"
    stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
  <!-- Ring (matches principles center: r=18-ish, sw=1.4, center glow filter) -->
  <!-- Note: principles center r=42 in a 480px canvas = ~8.75% of height.
             Here canvas is 320px; proportional r ≈ 28. We use r=18 for restraint. -->
  <circle cx="790" cy="160" r="18"
    fill="#0D1117" stroke="#A855F7" stroke-width="1.4"
    filter="url(#gc)"/>
  <!-- Inner ring (matches principles decorative inner ring) -->
  <circle cx="790" cy="160" r="12"
    fill="none" stroke="#A855F7" stroke-opacity="0.15" stroke-width="0.5"/>
  <!-- Inner dot (larger, brighter — matches principles center feel) -->
  <circle cx="790" cy="160" r="4.5" fill="#E9D5FF"/>

  <!-- Stage name — full brightness, slight size increase -->
  <text x="790" y="76"
    text-anchor="middle"
    fill="#E9D5FF"
    font-size="13" font-weight="600"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.8">Still Building</text>
  <!-- Question — slightly higher opacity than peers -->
  <text x="790" y="100"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.55"
    font-size="10" font-style="italic" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.3">What's next?</text>
  <!-- Lesson — slightly higher opacity than peers -->
  <text x="790" y="116"
    text-anchor="middle"
    fill="#C4B5FD" fill-opacity="0.38"
    font-size="10" font-weight="300"
    font-family="'Sora', ui-sans-serif, system-ui, sans-serif"
    letter-spacing="0.2">Always learning.</text>

</svg>
