name: Generate Snake Contribution Grid

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/v3
        with:
          github_user_name: VipranshOjha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00FFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FFFF

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

