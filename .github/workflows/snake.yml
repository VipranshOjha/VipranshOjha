name: Generate Snake Contribution Grid

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            # This is the version for light-mode viewers
            dist/github-contribution-grid-snake.svg?color_snake=00FFFF&color_dots=30363D,8CB9FF,58A6FF,3081F7,1F6FEB

            # This is the version for dark-mode viewers
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FFFF&color_dots=30363D,8CB9FF,58A6FF,3081F7,1F6FEB

