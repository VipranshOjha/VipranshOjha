name: Generate Snake Contribution Grid

on:
  # This allows you to run the workflow manually from the Actions tab
  workflow_dispatch:
  
  # This runs the workflow automatically every day at midnight
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # This step generates the two snake SVG files
      - uses: Platane/snk/v3
        with:
          github_user_name: VipranshOjha
          # The 'outputs' section specifies which files to create.
          # This makes one for light mode and one for dark mode,
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00FFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00FFFF

      # This step pushes the generated files to your 'output' branch
      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
